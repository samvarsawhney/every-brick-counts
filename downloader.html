<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk 3D Downloader - Every Brick Counts</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #f4f4f9; font-family: Arial, sans-serif; }
    .app-wrapper { padding: 40px 15px; box-sizing: border-box; width: 100%; max-width: 800px; margin: 0 auto; }
    .nav-link { display: inline-block; margin-bottom: 20px; color: #0066cc; text-decoration: none; font-weight: bold; }
    .nav-link:hover { text-decoration: underline; }
    .download-container { background: #ffffff; padding: 30px; border-radius: 8px; border: 1px solid #eaeaea; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; }
    h2 { margin-top: 0; color: #333; }
    p { font-size: 15px; color: #555; margin-bottom: 20px; line-height: 1.5; }
    #zipInput { padding: 12px; width: 100%; max-width: 400px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 15px; box-sizing: border-box; }
    button { padding: 12px 24px; font-size: 16px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    button:hover { background-color: #218838; }
    #zipStatus { margin-top: 15px; font-size: 15px; font-weight: bold; min-height: 20px; }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <a href="index.html" class="nav-link">← Back to Database Search</a>
    
    <div class="download-container">
      <h2>Instant 3D Model Downloader</h2>
      <p>Enter a list of Part IDs separated by commas (e.g., <strong>3001, 3003, 3004</strong>). The system will fetch the official LDraw files and package them into a ZIP folder instantly.</p>
      
      <input type="text" id="zipInput" placeholder="Enter Part IDs here...">
      <br>
      <button onclick="generateZip()">Download ZIP Now</button>
      
      <div id="zipStatus"></div>
    </div>
  </div>

  <script>
    async function generateZip() {
      var input = document.getElementById("zipInput").value;
      var statusText = document.getElementById("zipStatus");
      
      if (!input.trim()) {
        statusText.innerText = "Please enter at least one Part ID.";
        statusText.style.color = "#d9534f";
        return;
      }

      var partIds = input.split(",").map(id => id.trim().toLowerCase());
      statusText.innerText = "Fetching 3D models... Please wait.";
      statusText.style.color = "#0066cc";

      var zip = new JSZip();
      var filesFound = 0;

      for (var i = 0; i < partIds.length; i++) {
        var partId = partIds[i];
        if (!partId) continue;
        
        var ldrawUrl = `https://library.ldraw.org/library/official/parts/${partId}.dat`;
        
        try {
          var response = await fetch(ldrawUrl);
          if (response.ok) {
            var fileData = await response.text();
            zip.file(partId + ".dat", fileData);
            filesFound++;
          }
        } catch (e) {
          console.log("Could not fetch: " + partId);
        }
      }

      if (filesFound === 0) {
        statusText.innerText = "Error: None of those Part IDs have official 3D models available.";
        statusText.style.color = "#d9534f";
        return;
      }

      statusText.innerText = "Zipping files together...";

      zip.generateAsync({ type: "blob" }).then(function(content) {
        var link = document.createElement("a");
        link.href = URL.createObjectURL(content);
        link.download = "EveryBrickCounts_Models.zip";
        document.body.appendChild(link);
        link.click(); 
        document.body.removeChild(link);
        
        statusText.innerText = `Success! Downloaded ${filesFound} models.`;
        statusText.style.color = "#28a745";
      });
    }
  </script>
</body>
</html>
