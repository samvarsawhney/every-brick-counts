<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Parts</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 24px; }
  h1 { text-align: center; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    max-width: 900px;
    margin: 0 auto;
  }
  .card {
    background: white;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    overflow: hidden;
  }
  .card img { width: 100%; height: 140px; object-fit: cover; display: block; }
  .card-body { padding: 12px; }
  .card-body h3 { margin: 0 0 6px 0; }
  .card-body p { margin: 0; color: #555; font-size: 14px; }
</style>
</head>
<body>

<h1>Parts</h1>
<div id="cards" class="grid">Loading...</div>

<script>
  // 1. Fill these in with your own project's values.
  //    Find them in Supabase: Project Settings -> API
  const SUPABASE_URL = "https://YOUR-PROJECT-REF.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR-ANON-PUBLIC-KEY";

  // 2. Ask Supabase's auto-generated REST API for every row in the "parts" table
  fetch(`${SUPABASE_URL}/rest/v1/parts?select=*`, {
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
    }
  })
    .then(response => response.json())
    .then(parts => {
      const container = document.getElementById("cards");
      container.innerHTML = ""; // clear "Loading..."

      parts.forEach(part => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${part.image_url ?? 'https://placehold.co/600x400?text=Image+not+found'}" alt="${part.part_id}">
          <div class="card-body">
            <h2>${part.part_name}</h2>
            <h3>Brand:${part.brand}</h3>
            <h3>Part ID:${part.part_id}</h3>
            <input type="button" onclick="window.open('${part.purchase_url}')">Purchase Here</input>
          </div>
        `;
        container.appendChild(card);
      });
    })
    .catch(err => {
      document.getElementById("cards").innerText = "Could not load parts: " + err;
    });
</script>

</body>
</html>
